<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Navi Logos/PNG_logo copy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navi</title>
    <!-- Add KaTeX CSS -->
    <link rel="stylesheet" href="./node_modules/katex/dist/katex.min.css" /> 
    <script>
      // Only load analytics in production and with user consent
      if (typeof window !== 'undefined' && 
          (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') &&
          !location.hostname.includes('dev') &&
          !location.hostname.includes('staging')) {
        
        // Check if analytics should be loaded (you can extend this with region/consent checks)
        const shouldLoadAnalytics = () => {
          // Add your region/consent logic here
          // For example: return hasUserConsent() && isAllowedRegion();
          return true; // Modify based on your privacy requirements
        };

        if (shouldLoadAnalytics()) {
          const script = document.createElement('script');
          script.src = 'https://analytics.ahrefs.com/analytics.js';
          script.setAttribute('data-key', '4KdI3ADlhtIU7k9Xxb+msA');
          script.setAttribute('crossorigin', 'anonymous');
          script.setAttribute('integrity', 'sha384-PLACEHOLDER'); // Replace with actual hash
          script.async = true;
          
          // Handle SRI failures gracefully
          script.onerror = function() {
            console.warn('Analytics script failed to load - this may be due to SRI mismatch');
          };
          
          document.head.appendChild(script);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
